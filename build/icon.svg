<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- iLive Monitor app icon (iLive Touch's faders on the Sends-on-Faders purple). Source of truth: regenerate PNG/ICNS with `npm run icon`. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2346"/>
      <stop offset="1" stop-color="#140b19"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f6f8"/>
      <stop offset="0.55" stop-color="#cfd5db"/>
      <stop offset="1" stop-color="#9aa3ab"/>
    </linearGradient>
    <linearGradient id="slot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#000"/>
      <stop offset="1" stop-color="#1a1e22"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <filter id="icon-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- macOS icon grid: 824×824 body centred on the 1024 canvas -->
  <g filter="url(#icon-shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#rim)"/>
    <rect x="101.5" y="101.5" width="821" height="821" rx="183.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>
  </g>

  <!-- scale ticks -->
  <g stroke="#ffffff" stroke-opacity="0.16" stroke-width="6" stroke-linecap="round">
    <line x1="262" y1="290" x2="292" y2="290"/>
    <line x1="262" y1="400" x2="292" y2="400"/>
    <line x1="262" y1="510" x2="292" y2="510"/>
    <line x1="262" y1="620" x2="292" y2="620"/>
    <line x1="262" y1="730" x2="292" y2="730"/>
  </g>

  <!-- fader slots -->
  <g fill="url(#slot)">
    <rect x="359" y="250" width="26" height="524" rx="13"/>
    <rect x="499" y="250" width="26" height="524" rx="13"/>
    <rect x="639" y="250" width="26" height="524" rx="13"/>
  </g>

  <!-- fader caps at three different levels, each with a coloured index line -->
  <g filter="url(#shadow)">
    <g transform="translate(372 596)">
      <rect x="-64" y="-40" width="128" height="80" rx="16" fill="url(#cap)"/>
      <rect x="-52" y="-5" width="104" height="10" rx="5" fill="#ce93d8"/>
    </g>
    <g transform="translate(512 360)">
      <rect x="-64" y="-40" width="128" height="80" rx="16" fill="url(#cap)"/>
      <rect x="-52" y="-5" width="104" height="10" rx="5" fill="#ab47bc"/>
    </g>
    <g transform="translate(652 478)">
      <rect x="-64" y="-40" width="128" height="80" rx="16" fill="url(#cap)"/>
      <rect x="-52" y="-5" width="104" height="10" rx="5" fill="#e1bee7"/>
    </g>
  </g>
</svg>
