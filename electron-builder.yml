appId: uk.co.whiteleyevents.ilivemonitor
productName: iLive Monitor
copyright: Copyright © 2026 Whiteley Events
directories:
  buildResources: build
  output: release/${version}
files:
  - out/**/*
  - package.json
asar: true
# EULA, privacy notice and third-party licences inside the app (Contents/Resources/legal).
# scripts/release-site.sh builds them first; a local build without them simply ships none.
extraResources:
  - from: legal
    to: legal
    filter: ["*.pdf"]
mac:
  category: public.app-category.music
  icon: build/icon.icns
  # Whiteley Events release rules: Apple Silicon only, DMG only (no zip, no Intel).
  target:
    - target: dmg
      arch: [arm64]
  # The website reads the version and platform from this name; WEIM- is the product's shortcode on the site.
  artifactName: WEIM-${version}-${arch}.${ext}
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  # Notarises the .app via the keychain profile in APPLE_KEYCHAIN_PROFILE (scripts/release-site.sh sets WESC_NOTARY).
  notarize: true
  minimumSystemVersion: "14.0"
  extendInfo:
    NSLocalNetworkUsageDescription: iLive Monitor connects to your iDR48 MixRack over the local network.
    LSMinimumSystemVersion: "14.0"
dmg:
  # Signed, notarised and stapled by scripts/release-site.sh after the build.
  sign: false
  contents:
    - { x: 130, y: 220 }
    - { x: 410, y: 220, type: link, path: /Applications }
# Releases go to whiteleyevents.co.uk via scripts/release-site.sh, not via electron-builder.
publish: null
